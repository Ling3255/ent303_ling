server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 45m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
  }

  # PDF.js 的 worker 是 .mjs，nginx 自带的 mime.types 不认识，会按 octet-stream 返回，
  # Chrome 拒绝把它当模块加载，PDF 预览就打不开。这里清空类型表并强制用 JavaScript 类型。
  location ~* \.mjs$ {
    types {}
    default_type application/javascript;
    try_files $uri =404;
  }

  # 前端路由（/checks/xxx）都返回 index.html
  location / {
    try_files $uri /index.html;
  }
}
